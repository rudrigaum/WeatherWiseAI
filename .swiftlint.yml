
# WeatherWise AI - SwiftLint Configuration
# Baseline: SwiftLint 0.65.0

# MARK: - Included Directories

included:
  - WeatherWiseAI
  - WeatherWiseAITests
  - WeatherWiseAIUITests

# MARK: - Opt-In Rules

opt_in_rules:
  - closure_spacing
  - empty_count
  - empty_string
  - first_where
  - force_unwrapping
  - unowned_variable_capture

# MARK: - Rule Configuration

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 50
  error: 80

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 600

cyclomatic_complexity:
  warning: 10
  error: 20

force_unwrapping:
  severity: warning

# MARK: - Lint Behavior

strict: false
reporter: xcode

